    discovery_rules:
    - uuid: ae2199425d414cd98d4acc6e35494998
      name: 'Tor: Onion services discovery'
      type: DEPENDENT
      key: tor.onion.discovery
      master_item:
        key: tor.prometheus[{$TOR.METRICS.PORT}]
      lifetime: 7d
      description: Discovers onion labels from introduction gauges. Failed scrapes
        are discarded rather than treated as an empty list.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - if (!/^zbx_tor_metrics_ok 1$/m.test(value)) throw "Metrics unavailable";
          return value;
        error_handler: DISCARD_VALUE
      - type: PROMETHEUS_TO_JSON
        parameters:
        - tor_hs_intro_established_count
        error_handler: DISCARD_VALUE
      lld_macro_paths:
      - lld_macro: '{#ONION}'
        path: $.labels.onion
      filter:
        evaltype: AND
        conditions:
        - macro: '{#ONION}'
          value: ^[a-z2-7]{56}$
          operator: MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: 61032c67e8ee4d67912cba85b4c90f9e
        name: 'Tor onion [{#ONION}]: Introduction circuits'
        type: DEPENDENT
        key: tor.onion.intro.established[{#ONION}]
        history: 7d
        trends: 365d
        value_type: FLOAT
        master_item:
          key: tor.prometheus[{$TOR.METRICS.PORT}]
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - tor_hs_intro_established_count{onion="{#ONION}"}
          - value
          - ''
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: onion
        - tag: onion
          value: '{#ONION}'
        trigger_prototypes:
        - uuid: 39489264d6d64c909a7aaad81eb59f80
          name: 'Tor onion [{#ONION}]: No introduction circuits for 5 minutes'
          expression: max(/Template App Tor by Agent2 active/tor.onion.intro.established[{#ONION}],5m)<{$TOR.ONION.INTRO.MIN}
            and count(/Template App Tor by Agent2 active/tor.onion.intro.established[{#ONION}],5m)>=5
            and last(/Template App Tor by Agent2 active/tor.metrics.ok)=1 and nodata(/Template
            App Tor by Agent2 active/tor.metrics.ok,3m)=0
          priority: HIGH
        - uuid: 723c48ed4ed7490e88748f6fbd3f6bbd
          name: 'Tor onion [{#ONION}]: Introduction metrics missing for 10 minutes'
          expression: nodata(/Template App Tor by Agent2 active/tor.onion.intro.established[{#ONION}],10m)=1
            and last(/Template App Tor by Agent2 active/tor.metrics.ok)=1 and nodata(/Template
            App Tor by Agent2 active/tor.metrics.ok,3m)=0
          priority: WARNING
      - uuid: a01ce8fa0a0c490c9e2dca80ff23c849
        name: 'Tor onion [{#ONION}]: Rendezvous circuits'
        type: DEPENDENT
        key: tor.onion.rdv.established[{#ONION}]
        history: 7d
        trends: 365d
