    - uuid: 80d318ee03c94cfe9ac74ce9a349fce2
      name: 'Tor: Socket utilization'
      type: DEPENDENT
      key: tor.sockets.utilization
      history: 7d
      trends: 365d
      value_type: FLOAT
      master_item:
        key: tor.prometheus[{$TOR.METRICS.PORT}]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var opened = value.match(/^tor_relay_load_socket_total\{state="opened"\}\s+([0-9.]+)/m);

          var limit = value.match(/^zbx_tor_socket_limit\s+([0-9.]+)/m);

          if (!opened || !limit || Number(limit[1]) <= 0) throw "Socket metrics missing";

          return 100 * Number(opened[1]) / Number(limit[1]);'
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: tor
      units: '%'
      triggers:
      - uuid: b2138e70d6514d87988d121add873358
        name: 'Tor: Socket utilization high'
        expression: min(/Template App Tor by Agent2 active/tor.sockets.utilization,5m)>{$TOR.SOCKETS.WARN.PCT}
          and last(/Template App Tor by Agent2 active/tor.metrics.ok)=1 and nodata(/Template
