          - tor_hs_rdv_established_count{onion="{#ONION}"}
          - value
          - ''
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: onion
        - tag: onion
          value: '{#ONION}'
      - uuid: bf0eaeb2e3844f67b3e7be0c5c1695a5
        name: 'Tor onion [{#ONION}]: Introductions per second'
        type: DEPENDENT
        key: tor.onion.intro.rate[{#ONION}]
