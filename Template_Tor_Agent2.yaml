zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 2fdcbeab1c384acf97c831294e7661bb
    name: Templates/Applications
  templates:
  - uuid: 821ce4590487471a9ac3fcebbb5159e3
    template: Template App Tor by Agent2 active
    name: Template App Tor by Zabbix agent active
    description: Local C Tor monitoring via classic Zabbix agent or Agent2 active
      checks and native Prometheus preprocessing. Developed against Tor 0.4.9.11.
      Metrics do not prove end-to-end SOCKS or onion reachability. Relay flag alert
      is opt-in.
    groups:
    - name: Templates/Applications
    items:
    - uuid: 223f4b08d9da4179a888fe4a360e93eb
      name: 'Tor: Raw Prometheus metrics'
      type: ZABBIX_ACTIVE
      key: tor.prometheus[{$TOR.METRICS.PORT}]
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Fetched locally. Raw payload is not retained. Requires tor_prometheus.py
        and tor.conf.
    - uuid: f214a9f9459f47e0a2a067095783a28b
      name: 'Tor: Metrics available'
      type: DEPENDENT
      key: tor.metrics.ok
      history: 7d
      trends: 365d
      value_type: FLOAT
      master_item:
        key: tor.prometheus[{$TOR.METRICS.PORT}]
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - zbx_tor_metrics_ok
        - value
        - ''
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: tor
      triggers:
      - uuid: 2a0e3006694f479ca69635ae6dc626e0
        name: 'Tor: Metrics unavailable for 3 minutes'
        expression: max(/Template App Tor by Agent2 active/tor.metrics.ok,3m)=0
        priority: HIGH
      - uuid: 8135c15cc3954b219afcb09378b58efc
        name: 'Tor: No monitoring data for 5 minutes'
        expression: nodata(/Template App Tor by Agent2 active/tor.metrics.ok,5m)=1
        priority: HIGH
    - uuid: cf3766ec804949c5ad22b01a3341373d
